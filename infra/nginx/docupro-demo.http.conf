# Bootstrap HTTP-only — certbot HTTP-01. Remplacé par docupro-demo.conf après le certificat.
# Vhost isolé : server_name = docupro-demo.allianceconsultants.net uniquement.

server {
    listen 80;
    listen [::]:80;
    server_name docupro-demo.allianceconsultants.net;

    client_max_body_size 100m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
