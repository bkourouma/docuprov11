# DocuPro-V6 demo — vhost définitif TLS.
# Isolé : ne pas réutiliser pour docupro-new ni aucun autre serveur_name.
# Certificats gérés par certbot (Let's Encrypt).

upstream docupro_demo_web {
    server 127.0.0.1:3018;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name docupro-demo.allianceconsultants.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docupro-demo.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/docupro-demo.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docupro-demo.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://docupro_demo_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
