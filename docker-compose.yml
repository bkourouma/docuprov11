services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: archivage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archivage
      POSTGRES_PASSWORD: 29122003
      POSTGRES_DB: DocuPro
    ports:
      # Matches the DATABASE_URL in .env (postgresql://archivage:29122003@localhost:5432/DocuPro).
      # NOTE: a local PostgreSQL install on the host must be stopped first, or it will hold port 5432.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivage -d DocuPro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: archivage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api / worker / web services are added once their Dockerfiles exist (later phases).
  # For local dev, run the apps with `pnpm dev` against the postgres + redis above.

volumes:
  pgdata:
  redisdata:
